    <symbol id="i-search" viewBox="0 0 20 20"><circle cx="8.6" cy="8.6" r="5.3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12.6 12.6l4.4 4.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 20 20"><path d="M10 2.5l2 4.5 4.8.6-3.6 3.2 1 4.8L10 13.2l-4.2 2.4 1-4.8L3.2 7.6 8 7z" fill="currentColor"/></symbol>
  </svg>

  <div class="app" id="app">
    <header class="titlebar" id="titlebar">
      <div class="brand">
        <svg class="brand-sigil" aria-hidden="true"><use href="#sigil"/></svg>
        <div class="brand-text">
          <span class="brand-name">Grimório do Aventureiro</span>
          <span class="brand-sub">World of Warcraft: Forever</span>
        </div>
      </div>

      <div class="countdown" id="countdown" role="timer" aria-live="off">
        <svg class="wing wing-l" aria-hidden="true"><use href="#wing"/></svg>
        <div class="countdown-body">
          <span class="countdown-label" id="cd-label">Abertura do WoW Forever</span>
          <span class="countdown-value" id="cd-value">—</span>
          <span class="countdown-detail" id="cd-detail"></span>
        </div>
        <svg class="wing wing-r" aria-hidden="true"><use href="#wing"/></svg>
      </div>

      <div class="titlebar-actions">
        <button class="update-pill" id="update-pill" type="button" hidden></button>
        <button class="feed-status" id="feed-status" type="button" title="Ver estado das fontes ao vivo">
          <span class="dot" id="feed-dot"></span>
          <span id="feed-status-text">Fontes ao vivo</span>
        </button>
        <button class="icon-btn" id="btn-feedback" type="button" aria-label="Mandar dica, ideia ou erro" title="Mandar dica, ideia ou erro para o autor">
          <svg><use href="#i-chat"/></svg>
        </button>
        <button class="icon-btn" id="btn-refresh" type="button" aria-label="Buscar novidades agora" title="Buscar novidades agora">
          <svg><use href="#i-refresh"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" type="button" aria-label="Ajustes" title="Ajustes">
          <svg><use href="#i-cog"/></svg>
        </button>
        <span class="win-sep" aria-hidden="true"></span>
        <button class="icon-btn win-btn" id="win-min" type="button" aria-label="Minimizar" title="Minimizar"><svg viewBox="0 0 16 16"><path d="M3.5 8.5h9"/></svg></button>
        <button class="icon-btn win-btn" id="win-max" type="button" aria-label="Maximizar" title="Maximizar"><svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.2"/></svg></button>
        <button class="icon-btn win-btn win-close" id="win-close" type="button" aria-label="Fechar" title="Fechar"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
    </header>

    <main class="realm">
      <!-- NEWS: a hidden drawer, opened from the rail on the left -->
      <button class="news-rail" id="news-rail" type="button" aria-controls="news-drawer" aria-expanded="false" title="Abrir as notícias">
        <svg aria-hidden="true"><use href="#i-news"/></svg><span>Notícias</span><b class="rail-count" id="rail-count" hidden></b>
      </button>
      <!-- CHARACTER -->
      <section class="frame doll" data-frame aria-labelledby="t-char">
        <h2 class="plaque" id="t-char">Seu personagem</h2>
        <div class="doll-body" id="doll-body">
        <div class="doll-head">
          <div class="doll-identity">
            <span class="doll-level" id="doll-level">Nível 1</span>
            <span class="doll-race">Conecte o Armory em Ajustes</span>
          </div>
          <button class="armory-pill" id="armory-pill" type="button"></button>
        </div>
        <div class="paperdoll" id="paperdoll">
          <div class="slots slots-left" id="slots-left"></div>
          <div class="portrait" id="portrait">
            <div class="portrait-stage">
            <svg class="circle" viewBox="0 0 300 300" aria-hidden="true">
              <defs>
                <radialGradient id="g-portal" cx=".5" cy=".5" r=".5">
                  <stop offset="0" stop-color="#3f6022" stop-opacity=".85"/>
                  <stop offset=".6" stop-color="#1e2c11" stop-opacity=".6"/>
                  <stop offset="1" stop-color="#0d1209" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <circle cx="150" cy="150" r="146" fill="url(#g-portal)"/>
              <g class="reticle-glow"><image class="reticle" href="assets/reticle.png" x="0" y="0" width="300" height="300"/></g>
            </svg>
            <div class="portrait-center">
              <span class="portrait-glyph" id="portrait-glyph" aria-hidden="true"><svg><use href="#sigil"/></svg></span>
            </div>
            <div class="portrait-figure" id="portrait-figure" aria-hidden="true"></div>
            </div>
            <p class="portrait-note" id="portrait-note">O modelo do personagem aparece aqui quando o Armory do Forever estiver conectado.</p>
          </div>
          <div class="slots slots-right" id="slots-right"></div>
          <div class="slots slots-bottom" id="slots-bottom"></div>
        </div>

        <div class="subframe">
          <div class="tabs tabs-small" role="tablist" id="doll-tabs">
            <button role="tab" class="tab" data-pane="stats" aria-selected="true">Atributos</button>
            <button role="tab" class="tab" data-pane="gear" aria-selected="false">Equipamento <span class="count" id="c-gear"></span></button>
            <button role="tab" class="tab" data-pane="path" aria-selected="false">Rota</button>
          </div>
          <div class="scroll pane" id="pane-stats" role="tabpanel"></div>
          <div class="scroll pane" id="pane-gear" role="tabpanel" hidden></div>
          <div class="scroll pane" id="pane-path" role="tabpanel" hidden></div>
        </div>
        </div>
      </section>

      <!-- BUILDS -->
      <section class="frame grimoire" data-frame aria-labelledby="t-builds">
        <h2 class="plaque" id="t-builds">Guia de leveling<span class="tab-dot" id="guide-dot" hidden></span></h2>
        <button class="grim-expand icon-btn icon-btn-sm" id="btn-grimoire-full" data-gd="open" title="Abrir o guia completo" aria-label="Abrir o guia completo"><svg><use href="#i-out"/></svg></button>
        <div class="medallions" role="tablist" id="spec-tabs"></div>
        <div class="variant-switch" id="variant-switch" role="tablist"></div>
        <div class="scroll build" id="build"></div>
      </section>
      <section class="frame pvp" data-frame aria-labelledby="t-pvp">
        <h2 class="plaque plaque-pvp" id="t-pvp">PvP · Ranking</h2>
        <div class="pvp-bar">
          <button class="icon-btn icon-btn-sm" id="pvp-back" type="button" title="Voltar" aria-label="Voltar" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
          <button class="icon-btn icon-btn-sm" id="pvp-reload" type="button" title="Recarregar" aria-label="Recarregar"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5V5h-2.5"/></svg></button>
          <button class="btn btn-sm" id="pvp-hunter" type="button" title="Marcar Hunter no filtro de classe">Hunter</button>
          <span class="pvp-status" id="pvp-status" role="status"></span>
          <button class="icon-btn icon-btn-sm" id="pvp-browser" type="button" title="Abrir no navegador" aria-label="Abrir no navegador"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 3h4v4M13 3L7.5 8.5M11 9.5V12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2.5"/></svg></button>
        </div>
        <div class="pvp-stage"><webview id="pvp-view" partition="persist:pvp" allowpopups></webview></div>
        <div class="blood" aria-hidden="true">
          <img class="blood-drip" style="--dur:30s;--delay:0.2s" src="assets/blood/drip1.png" alt="">
          <img class="blood-drip" style="--dur:40s;--delay:2.5s" src="assets/blood/drip2.png" alt="">
          <img class="blood-drip" style="--dur:52s;--delay:5s" src="assets/blood/drip3.png" alt="">
          <img class="blood-splat sp1" src="assets/blood/splat1.png" alt="">
          <img class="blood-splat sp2" src="assets/blood/splat2.png" alt="">
          <img class="blood-splat sp3" src="assets/blood/splat3.png" alt="">
        </div>
      </section>
      <!-- Abas laterais da direita: Guia e PvP -->
      <div class="rail-stack">
        <button class="news-rail guide-rail" id="guide-rail" type="button" aria-controls="build" aria-expanded="false" title="Abrir o guia">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg><span>Guia</span><b class="rail-dot" id="guide-rail-dot" hidden></b>
        </button>
        <button class="news-rail pvp-rail" id="pvp-rail" type="button" aria-controls="pvp-view" aria-expanded="false" title="Abrir o ranking PvP">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l8 8M13 3L5 11M9.3 12.9l3.6-3.6M3.1 9.3l3.6 3.6M11 11l2.6 2.6M5 11l-2.6 2.6"/></svg><span>PvP</span><img class="rail-blood" src="assets/blood/drip-rail.png" alt="" aria-hidden="true">
        </button>
      </div>
    </main>

    <!-- News drawer -->
    <div class="drawer-backdrop" id="news-backdrop" hidden></div>
    <section class="frame chronicle news-drawer" id="news-drawer" data-frame aria-labelledby="t-news" hidden>
      <h2 class="plaque" id="t-news">Notícias</h2>
      <button class="dialog-close icon-btn" id="news-close" aria-label="Fechar as notícias"><svg><use href="#i-close"/></svg></button>
      <div class="tabs" role="tablist" id="news-tabs">
        <button role="tab" class="tab tab-wowhead" data-cat="wowhead" aria-selected="true"><svg aria-hidden="true"><use href="#src-wowhead"/></svg>Wowhead <span class="count" id="c-wowhead"></span></button>
        <button role="tab" class="tab tab-reddit" data-cat="reddit" aria-selected="false"><svg aria-hidden="true"><use href="#src-reddit"/></svg>Reddit <span class="count" id="c-reddit"></span></button>
        <button class="mark-all" id="news-markall" type="button" title="Marcar todas como vistas" aria-label="Marcar todas as notícias como vistas"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8.5l3 3 5.5-7M8 11.5l1.5 1.5 5-6.5"/></svg></button>
      </div>
      <div class="scroll news-list" id="news-list" role="tabpanel"></div>
    </section>
  </div>

  <!-- News detail: quest-log parchment -->
  <div class="modal" id="news-modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <article class="parchment parchment-news" id="news-parchment" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="nm-title">
      <div class="nm-progress" aria-hidden="true"><i id="nm-progress"></i></div>
      <button class="parchment-close" data-close aria-label="Fechar"><svg><use href="#i-close"/></svg></button>
      <div id="news-modal-body"></div>
      <button class="nm-top-btn" id="nm-top" type="button" hidden aria-label="Voltar ao início da notícia"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Início</button>
    </article>
  </div>

  <!-- Leveling guide (Mobalytics), full view -->
  <div class="modal" id="guide-modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <article class="parchment parchment-news" id="guide-parchment" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="gd-title">
      <div class="nm-progress" aria-hidden="true"><i id="gd-progress"></i></div>
      <button class="parchment-close" data-close aria-label="Fechar"><svg><use href="#i-close"/></svg></button>
      <div id="guide-modal-body"></div>
      <button class="nm-top-btn" id="gd-top" type="button" hidden aria-label="Voltar ao início do guia"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Início</button>
    </article>
  </div>

  <!-- Settings -->
  <div class="modal" id="settings-modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="frame dialog" data-frame role="dialog" aria-modal="true" aria-labelledby="st-title">
      <h2 class="plaque" id="st-title">Ajustes</h2>
      <button class="dialog-close icon-btn" data-close aria-label="Fechar"><svg><use href="#i-close"/></svg></button>
      <div class="scroll dialog-body" id="settings-body"></div>
    </div>
  </div>

  <!-- Tips, ideas and bug reports -->
  <div class="modal" id="feedback-modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="frame dialog dialog-fb" data-frame role="dialog" aria-modal="true" aria-labelledby="fb-title">
      <h2 class="plaque" id="fb-title">Dicas, ideias e erros</h2>
      <button class="dialog-close icon-btn" data-close aria-label="Fechar"><svg><use href="#i-close"/></svg></button>
      <div class="scroll dialog-body" id="feedback-body"></div>
    </div>
  </div>

  <!-- What's new after an update -->
  <div class="modal" id="whatsnew-modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="frame dialog dialog-fb" data-frame role="dialog" aria-modal="true" aria-labelledby="wn-title">
      <h2 class="plaque" id="wn-title">Novidades</h2>
      <button class="dialog-close icon-btn" data-close aria-label="Fechar"><svg><use href="#i-close"/></svg></button>
      <div class="scroll dialog-body" id="whatsnew-body"></div>
    </div>
  </div>

  <!-- Welcome: a floating window that walks through the app -->
  <div class="wl-spot" id="wl-spot" hidden></div>
  <div class="wl-dim" id="wl-dim" hidden></div>
  <div class="frame wl-card" id="wl-card" data-frame role="dialog" aria-labelledby="wl-title" hidden>
    <div class="wl-top"><span class="wl-count" id="wl-count"></span><button class="linkish" type="button" data-wl="skip">Pular tutorial</button></div>
    <h2 class="wl-title" id="wl-title"></h2>
    <div class="wl-body" id="wl-body"></div>
    <div class="wl-foot">
      <div class="wl-dots" id="wl-dots"></div>
      <div class="wl-nav">
        <button class="btn btn-quiet btn-sm" type="button" data-wl="back">Voltar</button>
        <button class="btn btn-sm" type="button" data-wl="next" id="wl-next">Próximo</button>
      </div>
    </div>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <!-- UI message, like the game's error/info line -->
  <div class="ui-message" id="ui-message" aria-live="polite"></div>

  <script src="app/util.js"></script>
  <script src="app/sound.js"></script>
  <script src="app/news.js"></script>
  <script src="app/community.js"></script>
  <script src="app/guide.js"></script>
  <script src="app/gear.js"></script>
  <script src="app/character.js"></script>
  <script src="app/settings.js"></script>
  <script src="app/feedback.js"></script>
  <script src="app/welcome.js"></script>
  <script src="app/main.js"></script>
  <script src="app/window.js"></script>
  <script src="app/pvp-panel.js"></script>
  <script src="app/panels.js"></script>
</body>
</html>
